[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "naniwa"
version = "0.1.0.dev9"
description = "Temporal consensus for gene regulatory networks using predictive families and panel-wide correction"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Adrián Segura"}]
keywords = ["gene regulatory networks", "consensus", "time series"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
infer = ["ANDREA==0.1.0"]

[project.urls]
Repository = "https://github.com/AdrianSeguraOrtiz/NANIWA"
Documentation = "https://github.com/AdrianSeguraOrtiz/NANIWA#readme"

[project.scripts]
naniwa = "naniwa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["naniwa", "naniwa.*"]
exclude = ["*.__pycache__"]

[tool.setuptools.package-data]
naniwa = ["catalog/*.json", "docker/greynet/Dockerfile", "docker/greynet/adapter.py", "docker/base/*/Dockerfile", "docker/base/*/run_tool.py", "docker/shared/*", "docker/*.txt"]
